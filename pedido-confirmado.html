<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido Confirmado — Criativo Brasil 3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23121212%22/><text x=%2250%22 y=%2266%22 font-size=%2244%22 fill=%22%23FFC107%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-weight=%22bold%22>CB</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<section class="section" style="min-height:60vh;display:flex;align-items:center">
  <div class="container" style="text-align:center;max-width:560px">
    <div style="width:88px;height:88px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 24px">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFC107" stroke-width="2" style="width:44px;height:44px"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1 style="font-size:30px">Pedido Confirmado!</h1>
    <p style="color:var(--gray-500);margin-top:12px">Obrigado pela sua compra. Enviamos os detalhes para o seu e-mail e você pode acompanhar tudo pela sua conta.</p>
    <div class="card" style="margin:28px 0;text-align:left">
      <div class="summary-row"><span>Número do Pedido</span><strong id="orderId">—</strong></div>
      <div class="summary-row"><span>Total</span><strong id="orderTotal">—</strong></div>
      <div class="summary-row"><span>Status</span><span class="badge-soft">Pagamento em Confirmação</span></div>
    </div>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a href="minha-conta.html?tab=pedidos" class="btn btn-outline">Ver Meus Pedidos</a>
      <a href="produtos.html" class="btn btn-gold">Continuar Comprando</a>
    </div>
  </div>
</section>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
  mountLayout(null);
  const id = new URLSearchParams(location.search).get('id');
  let order = null;
  try { order = JSON.parse(localStorage.getItem('cb3d_last_order')); } catch(e){}
  document.getElementById('orderId').textContent = id || (order && order.id) || 'CB3D-000000';
  document.getElementById('orderTotal').textContent = order ? formatBRL(order.total) : '—';
</script>
</body>
</html>

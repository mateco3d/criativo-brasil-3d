<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">Produto — Criativo Brasil 3D</title>
<meta name="description" id="pageDescTag" content="Detalhes do produto Criativo Brasil 3D">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .pd-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
  .pd-gallery-main { aspect-ratio: 1/1; border-radius: var(--radius); background: linear-gradient(145deg,#f4f4f4,#e9e9e9); display:flex; align-items:center; justify-content:center; overflow:hidden; cursor: zoom-in; position: relative; }
  .pd-gallery-main svg { width: 46%; height: 46%; color: var(--black); transition: transform .4s var(--ease); }
  .pd-gallery-main.zoomed svg { transform: scale(1.8); }
  .pd-thumbs { display: flex; gap: 10px; margin-top: 14px; }
  .pd-thumb { width: 74px; height: 74px; border-radius: 10px; background: linear-gradient(145deg,#f4f4f4,#e9e9e9); display: flex; align-items: center; justify-content: center; border: 2px solid transparent; cursor: pointer; }
  .pd-thumb.active { border-color: var(--gold); }
  .pd-thumb svg { width: 42%; height: 42%; color: var(--black); }
  .pd-cat { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--gray-500); font-weight: 700; }
  .pd-title { font-size: clamp(22px,3vw,32px); margin: 8px 0 12px; }
  .pd-rating { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--gray-500); margin-bottom: 18px; }
  .pd-rating .stars { color: var(--gold); letter-spacing: 2px; }
  .pd-price-block { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .pd-old { text-decoration: line-through; color: var(--gray-500); font-size: 16px; }
  .pd-new { font-size: 32px; font-weight: 800; }
  .pd-installment { color: var(--gray-500); font-size: 13.5px; margin-bottom: 22px; }
  .pd-short { color: var(--gray-700); font-size: 14.5px; line-height: 1.7; margin-bottom: 24px; }
  .pd-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; margin-bottom: 24px; }
  .pd-spec { display: flex; justify-content: space-between; font-size: 13px; padding: 10px 0; border-bottom: 1px dashed #eee; }
  .pd-spec b { color: var(--gray-500); font-weight: 600; }
  .pd-buybox { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .pd-actions { display: flex; gap: 12px; }
  .pd-actions .btn { flex: 1; padding: 16px; }
  .pd-stock { font-size: 13px; color: var(--green); font-weight: 700; display:flex; align-items:center; gap:6px; margin-bottom:18px; }
  .pd-coupon-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .pd-coupon-row input { flex: 1; padding: 12px 16px; border-radius: 10px; border: 1.5px solid #e2e2e2; }
  .pd-coupon-msg { font-size: 13px; margin: -10px 0 18px; display: none; }
  .pd-coupon-msg.ok { color: var(--green); display: block; }
  .pd-coupon-msg.err { color: var(--red); display: block; }
  .pd-tabs { display: flex; gap: 30px; border-bottom: 1px solid #eee; margin: 60px 0 30px; }
  .pd-tab { padding: 14px 2px; font-weight: 600; font-size: 14.5px; color: var(--gray-500); position: relative; cursor: pointer; }
  .pd-tab.active { color: var(--black); }
  .pd-tab.active::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:2px; background:var(--gold); }
  .pd-tab-content { display: none; }
  .pd-tab-content.active { display: block; }
  .qa-item { border-bottom: 1px solid #eee; padding: 18px 0; }
  .qa-q { font-weight: 700; font-size: 14px; margin-bottom: 8px; display:flex; gap:8px; }
  .qa-a { font-size: 13.5px; color: var(--gray-600); padding-left: 24px; }
  @media (max-width: 860px){ .pd-wrap { grid-template-columns: 1fr; gap: 24px; } .pd-specs { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="site-header"></div>

<div class="container">
  <div class="breadcrumb">
    <a href="index.html">Início</a><span class="sep">/</span>
    <a href="produtos.html" id="bcCat">Produtos</a><span class="sep">/</span>
    <span id="bcName">Produto</span>
  </div>
</div>

<section class="container" id="pdWrap" style="padding-bottom:40px">
  <div class="pd-wrap">
    <div>
      <div class="pd-gallery-main" id="pdMain"></div>
      <div class="pd-thumbs" id="pdThumbs"></div>
    </div>
    <div>
      <span class="pd-cat" id="pdCat"></span>
      <h1 class="pd-title" id="pdName"></h1>
      <div class="pd-rating"><span class="stars" id="pdStars"></span><span id="pdReviewsCount"></span></div>
      <div class="pd-price-block" id="pdPriceBlock"></div>
      <div class="pd-installment" id="pdInstallment"></div>
      <p class="pd-short" id="pdShort"></p>

      <div class="pd-specs" id="pdSpecs"></div>

      <div class="pd-stock" id="pdStock"></div>

      <div class="pd-coupon-row">
        <input type="text" id="pdCouponInput" placeholder="Cupom de desconto (se houver)">
        <button class="btn btn-black" type="button" id="pdCouponBtn">Aplicar</button>
      </div>
      <div class="pd-coupon-msg" id="pdCouponMsg"></div>

      <div class="pd-buybox">
        <div class="qty-box" style="height:48px">
          <button onclick="changeQty(-1)" style="width:40px">−</button>
          <input type="number" id="qtyInput" value="1" min="1" style="width:50px;border:none;text-align:center;font-size:15px">
          <button onclick="changeQty(1)" style="width:40px">+</button>
        </div>
        <button class="prod-fav" id="pdFavBtn" style="position:static;width:48px;height:48px" onclick="toggleProductFav()"></button>
      </div>
      <div class="pd-actions">
        <button class="btn btn-outline" onclick="addCurrentToCart()">Adicionar ao Carrinho</button>
        <button class="btn btn-gold" onclick="buyNow()">Comprar Agora</button>
      </div>
    </div>
  </div>

  <div class="pd-tabs">
    <div class="pd-tab active" data-tab="desc">Descrição</div>
    <div class="pd-tab" data-tab="reviews">Avaliações</div>
    <div class="pd-tab" data-tab="qa">Perguntas e Respostas</div>
  </div>
  <div class="pd-tab-content active" id="tab-desc">
    <p style="max-width:800px;line-height:1.8;color:var(--gray-700)" id="pdFullDesc"></p>
  </div>
  <div class="pd-tab-content" id="tab-reviews">
    <div class="review-grid" id="pdReviewGrid" style="grid-template-columns:repeat(2,1fr)"></div>
  </div>
  <div class="pd-tab-content" id="tab-qa">
    <div id="qaList"></div>
    <form style="margin-top:20px;display:flex;gap:10px" onsubmit="event.preventDefault(); showToast('Pergunta enviada!','Nossa equipe vai responder em breve.'); this.reset();">
      <input type="text" placeholder="Digite sua pergunta..." required style="flex:1;padding:12px 16px;border-radius:10px;border:1.5px solid #e2e2e2">
      <button class="btn btn-black" type="submit">Enviar</button>
    </form>
  </div>
</section>

<section class="section section-soft">
  <div class="container">
    <div class="section-head reveal"><div><span class="eyebrow">Você também pode gostar</span><h2 class="section-title">Produtos Relacionados</h2></div></div>
    <div class="prod-grid reveal" id="relatedGrid"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
  const slug = new URLSearchParams(location.search).get('slug');
  const p = getProduct(slug) || PRODUCTS[0];
  mountLayout(null);

  document.getElementById('pageTitleTag').textContent = p.name + ' — Criativo Brasil 3D';
  document.getElementById('pageDescTag').setAttribute('content', p.short);
  const catObj = CATEGORIES.find(c=>c.slug===p.cat);
  document.getElementById('bcCat').textContent = catObj.name;
  document.getElementById('bcCat').href = `produtos.html?cat=${p.cat}`;
  document.getElementById('bcName').textContent = p.name;
  // Se o produto tiver subcategoria (ex.: Casa > Banheiro), mostra um
  // terceiro nível no breadcrumb entre a categoria e o nome do produto.
  const subObj = p.subcat && catObj.subcategories && catObj.subcategories.find(s=>s.slug===p.subcat);
  if (subObj) {
    document.getElementById('bcCat').insertAdjacentHTML('afterend',
      `<span class="sep">/</span><a href="produtos.html?cat=${p.cat}&subcat=${p.subcat}">${subObj.name}</a>`);
  }

  document.getElementById('pdMain').innerHTML = iconFor(p.cat);
  document.getElementById('pdThumbs').innerHTML = Array.from({length:4}).map((_,i)=>`<div class="pd-thumb ${i===0?'active':''}">${iconFor(p.cat)}</div>`).join('');
  document.getElementById('pdMain').addEventListener('click', function(){ this.classList.toggle('zoomed'); });
  document.querySelectorAll('.pd-thumb').forEach(t=>t.addEventListener('click', function(){ document.querySelectorAll('.pd-thumb').forEach(x=>x.classList.remove('active')); this.classList.add('active'); }));

  document.getElementById('pdCat').textContent = catObj.name;
  document.getElementById('pdName').textContent = p.name;
  document.getElementById('pdStars').textContent = '★'.repeat(Math.round(p.rating)) + '☆'.repeat(5-Math.round(p.rating));
  document.getElementById('pdReviewsCount').textContent = `${p.rating.toFixed(1)} (${p.reviews} avaliações)`;
  document.getElementById('pdPriceBlock').innerHTML = p.promo
    ? `<span class="pd-old">${formatBRL(p.price)}</span><span class="pd-new">${formatBRL(p.promo)}</span>`
    : `<span class="pd-new">${formatBRL(p.price)}</span>`;
  document.getElementById('pdInstallment').textContent = installmentText(p.promo||p.price) + ' · à vista no Pix';
  document.getElementById('pdShort').textContent = p.short;
  document.getElementById('pdFullDesc').textContent = p.desc;

  const specs = [
    ['Material', p.material], ['Cor', p.cor], ['SKU', p.sku],
  ];
  document.getElementById('pdSpecs').innerHTML = specs.map(([k,v])=>`<div class="pd-spec"><b>${k}</b><span>${v}</span></div>`).join('');
  document.getElementById('pdStock').innerHTML = p.stock > 0 ? `${ICO.check} ${p.stock} unidades em estoque` : 'Sob encomenda';

  function renderFavBtn(){
    const active = Favorites.has(p.id);
    document.getElementById('pdFavBtn').classList.toggle('active', active);
    document.getElementById('pdFavBtn').innerHTML = ICO.heart;
  }
  renderFavBtn();
  window.toggleProductFav = function(){ Favorites.toggle(p.id); renderFavBtn(); showToast(Favorites.has(p.id)?'Adicionado aos favoritos':'Removido dos favoritos', p.name); };

  window.changeQty = function(delta){
    const inp = document.getElementById('qtyInput');
    inp.value = Math.max(1, (parseInt(inp.value)||1) + delta);
    renderCouponDiscount();
  };
  window.addCurrentToCart = function(){ addToCartWithFeedback(p.id, parseInt(document.getElementById('qtyInput').value)||1, true); };
  window.buyNow = function(){ addToCartWithFeedback(p.id, parseInt(document.getElementById('qtyInput').value)||1, false); location.href='checkout.html'; };

  // ---------- Cupom de desconto (validado no servidor) ----------
  // O código fica salvo no mesmo localStorage usado pelo carrinho e pelo
  // checkout (cb3d_coupon) — se o cupom for válido só para este produto,
  // o desconto só é aplicado quando este produto estiver no carrinho.
  let appliedCoupon = null; // { code, type, value } depois de validado
  const savedCouponCode = localStorage.getItem('cb3d_coupon');
  if (savedCouponCode) document.getElementById('pdCouponInput').value = savedCouponCode;

  function renderCouponDiscount(){
    const msgEl = document.getElementById('pdCouponMsg');
    if (!appliedCoupon){ msgEl.className = 'pd-coupon-msg'; msgEl.textContent = ''; return; }
    const qty = parseInt(document.getElementById('qtyInput').value)||1;
    const unit = p.promo || p.price;
    let desconto = 0;
    if (appliedCoupon.type === 'percent') desconto = round2(unit*qty*(appliedCoupon.value/100));
    else if (appliedCoupon.type === 'fixed') desconto = Math.min(appliedCoupon.value, unit*qty);
    const texto = appliedCoupon.type === 'shipping'
      ? `Cupom ${appliedCoupon.code} aplicado: frete grátis para este produto.`
      : `Cupom ${appliedCoupon.code} aplicado: -${formatBRL(desconto)} neste produto.`;
    msgEl.className = 'pd-coupon-msg ok';
    msgEl.textContent = texto;
  }
  function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }

  async function tentarAplicarCupom(code){
    const msgEl = document.getElementById('pdCouponMsg');
    if (!code){ appliedCoupon = null; renderCouponDiscount(); return; }
    try {
      const res = await fetch('/api/aplicar-cupom', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, items: [{ id: p.id, qty: parseInt(document.getElementById('qtyInput').value)||1 }] }),
      });
      const data = await res.json();
      if (data.valid){
        appliedCoupon = { code: data.code, type: data.type, value: data.value };
        localStorage.setItem('cb3d_coupon', data.code);
        renderCouponDiscount();
      } else {
        appliedCoupon = null;
        msgEl.className = 'pd-coupon-msg err';
        msgEl.textContent = data.message || 'Cupom inválido.';
      }
    } catch (e) {
      appliedCoupon = null;
      msgEl.className = 'pd-coupon-msg err';
      msgEl.textContent = 'Não foi possível validar o cupom agora.';
    }
  }
  document.getElementById('pdCouponBtn').addEventListener('click', () => {
    tentarAplicarCupom(document.getElementById('pdCouponInput').value.trim().toUpperCase());
  });
  document.getElementById('pdCouponInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); tentarAplicarCupom(document.getElementById('pdCouponInput').value.trim().toUpperCase()); }
  });
  if (savedCouponCode) tentarAplicarCupom(savedCouponCode);

  // Tabs
  document.querySelectorAll('.pd-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.pd-tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.pd-tab-content').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-'+tab.dataset.tab).classList.add('active');
    });
  });

  // Reviews
  document.getElementById('pdReviewGrid').innerHTML = REVIEWS.slice(0,4).map(r => `
    <div class="review-card">
      <div class="review-stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</div>
      <p class="review-text">“${r.text}”</p>
      <div class="review-user">
        <div class="review-avatar">${r.name.split(' ').map(n=>n[0]).slice(0,2).join('')}</div>
        <div><div class="review-name">${r.name}</div><div class="review-loc">${r.loc}</div></div>
      </div>
    </div>`).join('');

  // Q&A
  document.getElementById('qaList').innerHTML = QA_SAMPLE.map(qa => `
    <div class="qa-item"><div class="qa-q">Q: ${qa.q}</div><div class="qa-a">R: ${qa.a}</div></div>`).join('');

  // Relacionados
  document.getElementById('relatedGrid').innerHTML = relatedProducts(p, 4).map(productCardHTML).join('');

  // JSON-LD produto
  const ld = document.createElement('script');
  ld.type = 'application/ld+json';
  ld.textContent = JSON.stringify({
    "@context":"https://schema.org","@type":"Product","name":p.name,"description":p.short,
    "sku":p.sku,"offers":{"@type":"Offer","priceCurrency":"BRL","price":(p.promo||p.price).toFixed(2),"availability":"https://schema.org/InStock"},
    "aggregateRating":{"@type":"AggregateRating","ratingValue":p.rating,"reviewCount":p.reviews}
  });
  document.head.appendChild(ld);
</script>
</body>
</html>

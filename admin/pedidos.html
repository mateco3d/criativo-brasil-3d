<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos — Painel Admin | Criativo Brasil 3D</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  adminLayout('pedidos.html', 'Pedidos', 'Acompanhe e gerencie todos os pedidos da loja');
  const c = document.getElementById('adminContent');

  const STATUS = ['Aguardando Pagamento','Processando','Enviado','Entregue','Cancelado'];
  const stPill = { 'Aguardando Pagamento':'pill-gray','Processando':'pill-gold','Enviado':'pill-blue','Entregue':'pill-green','Cancelado':'pill-red' };

  // -------------------------------------------------------------------
  // Status do e-mail de rastreio (enviado ao CLIENTE quando o pedido é
  // marcado como "Enviado" com um código) — mostra se realmente foi
  // entregue ao Gmail da loja ou se falhou, em vez de assumir que deu
  // certo silenciosamente (ver api/orders.js → tentarEnviarRastreio).
  function emailStatusInfo(o){
    if (!o.tracking_code) return null; // nada foi enviado ainda, nem faz sentido mostrar
    // Cores em hex puro (não var()) porque o modal usa ${color}14/${color}44
    // para gerar um fundo/borda translúcidos (#RRGGBBAA) — não dá pra
    // concatenar um sufixo de alfa depois de uma chamada var(...).
    switch (o.tracking_email_status) {
      case 'sent':
        return { color: '#1e8e3e', text: `E-mail de rastreio enviado ao cliente${o.tracking_email_sent_at ? ' em ' + fmtDateHora(o.tracking_email_sent_at) : ''}.` };
      case 'failed':
        return { color: '#c0392b', text: `Falha ao enviar o e-mail de rastreio${o.tracking_email_sent_at ? ' (tentativa em ' + fmtDateHora(o.tracking_email_sent_at) + ')' : ''}: ${o.tracking_email_error || 'motivo desconhecido'}.` };
      case 'no_email':
        return { color: '#888888', text: 'Este pedido não tem e-mail do cliente salvo — não foi possível notificar.' };
      default:
        return { color: '#888888', text: 'Ainda não houve tentativa de envio do e-mail de rastreio.' };
    }
  }
  function fmtDateHora(iso){
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' às '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }

  // Pedidos reais, vindos do banco de dados (Postgres/Neon) via /api/orders.
  // Cada pedido feito pelo checkout do site (qualquer cliente, qualquer
  // navegador/dispositivo) aparece aqui automaticamente.
  let allOrders = [];

  function fmtDate(iso){
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return '—';
    return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
  }

  // Data local (do navegador) no formato AAAA-MM-DD — usada para comparar
  // com os campos <input type="date"> do filtro e com o botão "Hoje".
  // Importante usar a data LOCAL (não a UTC) para bater com o dia que o
  // admin realmente está vendo no relógio dele.
  function toYMD(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function render(){
    let orders = allOrders;
    const statusVal = document.getElementById('statusFilter').value;
    const dataInicio = document.getElementById('dataInicio').value;
    const dataFim = document.getElementById('dataFim').value;
    if (statusVal) orders = orders.filter(o => o.status === statusVal);
    if (dataInicio) orders = orders.filter(o => o.created_at && toYMD(new Date(o.created_at)) >= dataInicio);
    if (dataFim) orders = orders.filter(o => o.created_at && toYMD(new Date(o.created_at)) <= dataFim);
    document.getElementById('ordTbody').innerHTML = orders.map((o) => {
      const itemCount = (o.itemsDetail||[]).reduce((n,it)=>n+(it.qty||0),0) || 1;
      return `
      <tr>
        <td><strong>${o.id}</strong></td>
        <td>${o.cliente || 'Cliente'}</td>
        <td>${fmtDate(o.created_at)}</td>
        <td>${itemCount} itens</td>
        <td>${formatBRL(o.total)}</td>
        <td>
          <select onchange="changeStatus('${o.id}', this.value)" style="border:none;background:transparent;font-size:12px;font-weight:700" class="pill ${stPill[o.status]}">
            ${STATUS.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </td>
        <td>
          <div class="row-actions" style="align-items:center">
            <button title="Ver detalhes" onclick="verDetalhes('${o.id}')">${AICO.eye}</button>
            <button title="Dados para postagem" onclick="abrirPostagem('${o.id}')">${AICO.print}</button>
            ${o.tracking_email_status === 'failed' ? `<span title="Falha ao enviar e-mail de rastreio — veja em Detalhes" style="font-size:11px;font-weight:700;color:var(--red,#c0392b);background:#fdeaea;border-radius:6px;padding:3px 7px">✉ falhou</span>` : ''}
          </div>
        </td>
      </tr>`;
    }).join('') || `<tr><td colspan="7" style="text-align:center;color:#999;padding:30px">Nenhum pedido encontrado.</td></tr>`;
  }
  function verDetalhes(id){
    const o = allOrders.find(x=>x.id===id);
    if (!o) return;
    const itensHtml = (o.itemsDetail||[]).map(it => `<li>${it.qty}x ${it.name}</li>`).join('') || '<li>—</li>';
    const emailInfo = emailStatusInfo(o);

    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
    modal.innerHTML = `
      <div style="background:#fff;border-radius:14px;max-width:460px;width:100%;padding:26px;max-height:85vh;overflow:auto">
        <h3 style="margin:0 0 4px">Pedido ${o.id}</h3>
        <p style="font-size:13px;color:var(--gray-500);margin:0 0 16px">${o.cliente||'—'} (${o.email||'sem e-mail salvo'})${o.telefone ? ' — ' + o.telefone : ''}</p>
        <p style="font-size:13px;margin:0 0 4px"><strong>Status:</strong> ${o.status}</p>
        <p style="font-size:13px;margin:0 0 4px"><strong>Total:</strong> ${formatBRL(o.total)}</p>
        ${o.tracking_code ? `<p style="font-size:13px;margin:0 0 4px"><strong>Código de rastreio:</strong> ${o.tracking_code}</p>` : ''}
        <p style="font-size:13px;margin:12px 0 6px"><strong>Itens:</strong></p>
        <ul style="font-size:13px;margin:0 0 16px;padding-left:18px">${itensHtml}</ul>
        ${emailInfo ? `
          <div style="border-radius:10px;padding:12px 14px;background:${emailInfo.color}14;border:1px solid ${emailInfo.color}44;margin-bottom:16px">
            <p style="font-size:12.5px;margin:0;color:${emailInfo.color}">${emailInfo.text}</p>
            ${o.tracking_code ? `<button class="btn btn-ghost" style="margin-top:10px;padding:7px 12px;font-size:12px" id="reenviarEmailBtn">Reenviar e-mail de rastreio</button>` : ''}
          </div>` : ''}
        <button class="btn btn-ghost" style="width:100%" id="fecharDetalhesBtn">Fechar</button>
      </div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', (e)=>{ if (e.target === modal) modal.remove(); });
    modal.querySelector('#fecharDetalhesBtn').addEventListener('click', ()=> modal.remove());
    const reenviarBtn = modal.querySelector('#reenviarEmailBtn');
    if (reenviarBtn) {
      reenviarBtn.addEventListener('click', async ()=>{
        reenviarBtn.disabled = true; reenviarBtn.textContent = 'Enviando...';
        const result = await resendTrackingEmail(id);
        const te = result && result.trackingEmail;
        if (te) {
          o.tracking_email_status = te.status === 'sent' ? 'sent' : (te.status === 'no_email' ? 'no_email' : (te.status === 'failed' ? 'failed' : o.tracking_email_status));
          o.tracking_email_error = te.error || null;
          o.tracking_email_sent_at = new Date().toISOString();
        }
        modal.remove();
        render();
        if (te && te.status === 'sent') showToast('E-mail enviado!', 'O cliente foi notificado com o código de rastreio.');
        else if (te && te.status === 'no_email') showToast('Sem e-mail salvo', 'Este pedido não tem e-mail do cliente.');
        else showToast('Falha ao enviar', (te && te.error) || 'Não foi possível enviar o e-mail. Tente novamente.');
      });
    }
  }

  // -------------------------------------------------------------------
  // "Dados para postagem" — a emissão automática da etiqueta ainda não
  // está integrada (isso exigiria uma permissão extra no token da Melhor
  // Envio, hoje limitado só à cotação — ver claude/site-progresso.md).
  // Enquanto isso não é feito, este painel pelo menos junta tudo que é
  // preciso digitar no site da Melhor Envio num lugar só — endereço
  // completo, CPF, serviço já escolhido/pago e peso/dimensões calculados
  // a partir do catálogo — com um botão de copiar, para não ter que
  // procurar essas informações em vários lugares (e-mail, catálogo, etc.)
  // nem redigitar tudo à mão.
  const CEP_ORIGEM = '11730-576';

  function pesoDimensoesPedido(itemsDetail){
    let pesoKg = 0, maiorComp = 0, maiorLarg = 0, somaAlt = 0, algumEstimado = false;
    (itemsDetail||[]).forEach(it => {
      const p = typeof getProduct === 'function' ? getProduct(it.product_id) : null;
      const qty = it.qty || 1;
      if (p && p.weight_kg){
        pesoKg += p.weight_kg * qty;
        maiorComp = Math.max(maiorComp, p.length_cm||0);
        maiorLarg = Math.max(maiorLarg, p.width_cm||0);
        somaAlt += (p.height_cm||0) * qty;
      } else {
        // Produto não encontrado no catálogo (ex.: removido depois da venda)
        // — usa uma estimativa razoável só para não travar a tela.
        pesoKg += 0.3 * qty;
        maiorComp = Math.max(maiorComp, 16); maiorLarg = Math.max(maiorLarg, 11); somaAlt += 5 * qty;
        algumEstimado = true;
      }
    });
    return {
      pesoKg: Math.max(0.1, round2(pesoKg)),
      compCm: Math.max(16, Math.ceil(maiorComp)),
      largCm: Math.max(11, Math.ceil(maiorLarg)),
      altCm: Math.max(2, Math.ceil(somaAlt)),
      algumEstimado,
    };
  }
  function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }

  function abrirPostagem(id){
    const o = allOrders.find(x=>x.id===id);
    if (!o) return;
    const dim = pesoDimensoesPedido(o.itemsDetail);
    const enderecoLinha = [
      [o.rua, o.numero].filter(Boolean).join(', '),
      o.complemento,
      o.bairro,
      [o.cidade, o.uf].filter(Boolean).join('/'),
      o.cep,
    ].filter(Boolean).join(' — ');
    const temEndereco = !!(o.rua && o.cep);

    const texto = [
      `Pedido: ${o.id}`,
      `Destinatário: ${o.cliente || '—'}${o.cpf ? ' — CPF ' + o.cpf : ''}`,
      `Telefone: ${o.telefone || '—'}`,
      `Endereço: ${temEndereco ? enderecoLinha : 'não informado neste pedido'}`,
      `CEP origem (remetente): ${CEP_ORIGEM}`,
      `Serviço escolhido no site: ${o.shipping_label || '—'} (frete pago: ${formatBRL(o.shipping||0)})`,
      `Peso estimado: ${dim.pesoKg} kg`,
      `Dimensões estimadas: ${dim.compCm} x ${dim.largCm} x ${dim.altCm} cm`,
    ].join('\n');

    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
    modal.innerHTML = `
      <div style="background:#fff;border-radius:14px;max-width:480px;width:100%;padding:26px;max-height:85vh;overflow:auto">
        <h3 style="margin:0 0 4px">Dados para postagem — ${o.id}</h3>
        <p style="font-size:12.5px;color:var(--gray-500);margin:0 0 18px">Cole estes dados no site da Melhor Envio para gerar a etiqueta. A emissão automática ainda não está integrada.</p>
        ${!temEndereco ? '<p style="font-size:12.5px;color:var(--red);margin:0 0 12px">Este pedido não tem endereço completo salvo (foi feito antes desta atualização). Confirme o endereço direto com o cliente.</p>' : ''}
        ${dim.algumEstimado ? '<p style="font-size:12.5px;color:var(--red);margin:0 0 12px">Peso/dimensões de ao menos um item foram estimados (produto não encontrado no catálogo atual) — confira antes de postar.</p>' : ''}
        <pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;background:var(--gray-100,#f4f4f4);border-radius:10px;padding:14px;line-height:1.7">${texto}</pre>
        <div style="display:flex;gap:10px;margin-top:16px">
          <button class="btn btn-gold" style="flex:1" id="copiarPostagemBtn">Copiar dados</button>
          <button class="btn btn-ghost" id="fecharPostagemBtn">Fechar</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', (e)=>{ if (e.target === modal) modal.remove(); });
    modal.querySelector('#fecharPostagemBtn').addEventListener('click', ()=> modal.remove());
    modal.querySelector('#copiarPostagemBtn').addEventListener('click', async ()=>{
      try {
        await navigator.clipboard.writeText(texto);
        showToast('Copiado!', 'Dados prontos para colar na Melhor Envio.');
      } catch (e) {
        showToast('Não foi possível copiar', 'Selecione o texto manualmente.');
      }
    });
  }
  window.abrirPostagem = abrirPostagem;

  // -------------------------------------------------------------------
  // Ao marcar um pedido como "Enviado", abre um pequeno formulário para
  // colar o código de rastreio dos Correios. Se um e-mail for salvo no
  // pedido, isso dispara automaticamente um e-mail para o cliente com o
  // código e o link de rastreamento (ver api/_email.js → sendShippedEmail).
  // O admin pode pular essa etapa e preencher depois, se ainda não tiver
  // o código em mãos (ex.: ainda não comprou a etiqueta na Melhor Envio).
  function abrirRastreio(id){
    const o = allOrders.find(x=>x.id===id);
    if (!o) return;
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
    modal.innerHTML = `
      <div style="background:#fff;border-radius:14px;max-width:420px;width:100%;padding:26px">
        <h3 style="margin:0 0 4px">Pedido marcado como Enviado — ${o.id}</h3>
        <p style="font-size:12.5px;color:var(--gray-500);margin:0 0 16px">Cole o código de rastreio dos Correios (gerado na Melhor Envio) para avisar o cliente automaticamente por e-mail. Pode deixar em branco e preencher depois.</p>
        <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:6px">Código de rastreio</label>
        <input id="rastreioInput" type="text" placeholder="Ex: AA123456789BR" value="${o.tracking_code || ''}" style="width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid #e2e2e2;font-size:13.5px;margin-bottom:16px;box-sizing:border-box">
        ${!o.email ? '<p style="font-size:11.5px;color:var(--red);margin:0 0 16px">Este pedido não tem e-mail salvo — não será possível notificar automaticamente, mesmo salvando o código.</p>' : ''}
        <div style="display:flex;gap:10px">
          <button class="btn btn-gold" style="flex:1" id="salvarRastreioBtn">${o.email ? 'Salvar e notificar cliente' : 'Salvar código'}</button>
          <button class="btn btn-ghost" id="pularRastreioBtn">Pular por agora</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', (e)=>{ if (e.target === modal) modal.remove(); });
    modal.querySelector('#pularRastreioBtn').addEventListener('click', ()=> modal.remove());
    modal.querySelector('#salvarRastreioBtn').addEventListener('click', async ()=>{
      const code = modal.querySelector('#rastreioInput').value.trim();
      modal.remove();
      if (!code) return;
      const result = await updateOrderStatus(id, 'Enviado', code);
      o.tracking_code = code;
      const te = result && result.trackingEmail;
      if (te) {
        o.tracking_email_status = te.status;
        o.tracking_email_error = te.error || null;
        o.tracking_email_sent_at = new Date().toISOString();
      }
      render();
      if (te && te.status === 'sent') showToast('Cliente notificado!', 'E-mail com o código de rastreio foi enviado.');
      else if (te && te.status === 'no_email') showToast('Código salvo', 'Este pedido não tem e-mail salvo para notificar.');
      else if (te && te.status === 'failed') showToast('Código salvo, mas o e-mail falhou', 'Veja em "Ver detalhes" para reenviar.');
      else showToast('Código salvo', '');
    });
  }
  window.abrirRastreio = abrirRastreio;

  async function changeStatus(id, status){
    const o = allOrders.find(x=>x.id===id); if (o) o.status = status;
    render();
    await updateOrderStatus(id, status);
    if (status === 'Enviado') abrirRastreio(id);
  }
  window.changeStatus = changeStatus;
  window.verDetalhes = verDetalhes;

  // -------------------------------------------------------------------
  // Filtro por data — busca pedidos de um dia específico ou de um período
  // (ex.: "quero achar um pedido de tal data"). Combina com o filtro de
  // status já existente. O botão "Hoje" preenche as duas datas com o dia
  // atual; "Limpar" tira o filtro de data (mantendo o de status).
  function filtrarHoje(){
    const hoje = toYMD(new Date());
    document.getElementById('dataInicio').value = hoje;
    document.getElementById('dataFim').value = hoje;
    render();
  }
  window.filtrarHoje = filtrarHoje;
  function limparFiltroData(){
    document.getElementById('dataInicio').value = '';
    document.getElementById('dataFim').value = '';
    render();
  }
  window.limparFiltroData = limparFiltroData;

  c.innerHTML = `
    <div class="admin-panel">
      <div class="admin-toolbar" style="flex-wrap:wrap;gap:12px;align-items:center">
        <h3 style="margin:0">Todos os Pedidos</h3>
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
          <label style="font-size:12px;color:var(--gray-500);display:flex;align-items:center;gap:6px">De
            <input type="date" id="dataInicio" onchange="render()" style="padding:9px 10px;border-radius:9px;border:1.5px solid #e2e2e2;font-size:13px">
          </label>
          <label style="font-size:12px;color:var(--gray-500);display:flex;align-items:center;gap:6px">até
            <input type="date" id="dataFim" onchange="render()" style="padding:9px 10px;border-radius:9px;border:1.5px solid #e2e2e2;font-size:13px">
          </label>
          <button class="btn btn-ghost" style="padding:9px 14px;font-size:12.5px" onclick="filtrarHoje()">Pedidos de hoje</button>
          <button class="btn btn-ghost" style="padding:9px 14px;font-size:12.5px" onclick="limparFiltroData()">Limpar data</button>
          <select id="statusFilter" onchange="render()" style="padding:10px 14px;border-radius:10px;border:1.5px solid #e2e2e2;font-size:13px">
            <option value="">Todos os status</option>
            ${STATUS.map(s=>`<option value="${s}">${s}</option>`).join('')}
          </select>
        </div>
      </div>
      <div style="overflow-x:auto">
        <table class="admin-table">
          <thead><tr><th>Pedido</th><th>Cliente</th><th>Data</th><th>Itens</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead>
          <tbody id="ordTbody"><tr><td colspan="7" style="text-align:center;color:#999;padding:30px">Carregando pedidos...</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="admin-panel" style="border:1.5px solid #f3c9c9;background:#fff8f8;margin-top:20px">
      <h3 style="margin:0 0 6px;color:var(--red,#c0392b)">Zona de Risco</h3>
      <p style="font-size:12.5px;color:#8a4a4a;margin:0 0 14px">Apaga permanentemente TODOS os pedidos do banco de dados (não afeta produtos nem categorias). Use isto só quando quiser zerar os pedidos de teste antes de começar a vender de verdade. Esta ação não pode ser desfeita.</p>
      <button class="btn btn-black" style="background:var(--red,#c0392b)" onclick="abrirApagarPedidos()">Apagar todos os pedidos</button>
    </div>`;

  // -------------------------------------------------------------------
  // Apagar todos os pedidos é uma ação irreversível sobre dados reais do
  // banco — por isso o admin precisa digitar a frase exata de confirmação
  // (o servidor também exige essa mesma frase no corpo da requisição, ver
  // api/orders.js). Sem digitar certinho, nada é apagado.
  const FRASE_CONFIRMACAO = 'APAGAR TODOS OS PEDIDOS';
  function abrirApagarPedidos(){
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
    modal.innerHTML = `
      <div style="background:#fff;border-radius:14px;max-width:460px;width:100%;padding:26px">
        <h3 style="margin:0 0 4px;color:var(--red,#c0392b)">Apagar todos os pedidos</h3>
        <p style="font-size:12.5px;color:var(--gray-500);margin:0 0 14px">Isso vai apagar permanentemente todos os ${allOrders.length} pedido(s) atualmente salvos no banco de dados. Não pode ser desfeito. Para confirmar, digite exatamente:</p>
        <p style="font-size:13px;font-weight:700;background:#f4f4f4;border-radius:8px;padding:8px 12px;margin:0 0 14px;user-select:all">${FRASE_CONFIRMACAO}</p>
        <input id="confirmApagarInput" type="text" placeholder="Digite a frase acima" style="width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid #e2e2e2;font-size:13.5px;margin-bottom:16px;box-sizing:border-box">
        <div style="display:flex;gap:10px">
          <button class="btn btn-ghost" style="flex:1" id="cancelarApagarBtn">Cancelar</button>
          <button class="btn btn-black" style="flex:1;background:var(--red,#c0392b)" id="confirmarApagarBtn">Apagar definitivamente</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', (e)=>{ if (e.target === modal) modal.remove(); });
    modal.querySelector('#cancelarApagarBtn').addEventListener('click', ()=> modal.remove());
    modal.querySelector('#confirmarApagarBtn').addEventListener('click', async ()=>{
      const digitado = modal.querySelector('#confirmApagarInput').value.trim();
      if (digitado !== FRASE_CONFIRMACAO) {
        showToast('Frase incorreta', 'Digite exatamente "' + FRASE_CONFIRMACAO + '" para confirmar.');
        return;
      }
      const btn = modal.querySelector('#confirmarApagarBtn');
      btn.disabled = true; btn.textContent = 'Apagando...';
      const result = await deleteAllOrders(digitado);
      modal.remove();
      if (result.ok) {
        allOrders = [];
        render();
        refreshOrderBadge();
        showToast('Pedidos apagados', (result.deleted||0) + ' pedido(s) removido(s) do banco de dados.');
      } else {
        showToast('Não foi possível apagar', result.error || 'Tente novamente.');
      }
    });
  }
  window.abrirApagarPedidos = abrirApagarPedidos;

  (async function init(){
    allOrders = await fetchOrders();
    render();
    await markOrdersSeen();
    refreshOrderBadge();
  })();
</script>
</body>
</html>

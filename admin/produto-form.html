<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Produto — Painel Admin | Criativo Brasil 3D</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  const editId = new URLSearchParams(location.search).get('id');
  adminLayout('produtos.html', editId ? 'Editar Produto' : 'Novo Produto', 'Preencha as informações completas do produto');
  const c = document.getElementById('adminContent');
  AdminStore.seed();
  const existing = editId ? AdminStore.get('products').find(p=>p.id===editId) : null;
  const e = existing || { id:'p'+Date.now(), tags:[] };

  c.innerHTML = `
    <form class="admin-grid-2" id="prodForm">
      <div>
        <div class="admin-panel kv-form">
          <h3>Informações Básicas</h3>
          <div class="form-row cols-2">
            <div class="form-group"><label>Nome do Produto</label><input type="text" id="f_name" value="${e.name||''}" required></div>
            <div class="form-group"><label>Slug (URL)</label><input type="text" id="f_slug" value="${e.slug||''}" required></div>
          </div>
          <div class="form-row cols-2">
            <div class="form-group"><label>Categoria</label>
              <select id="f_cat">${CATEGORIES.map(cc=>`<option value="${cc.slug}" ${e.cat===cc.slug?'selected':''}>${cc.name}</option>`).join('')}</select>
            </div>
            <div class="form-group"><label>Subcategoria</label>
              <select id="f_subcat"></select>
            </div>
          </div>
          <div class="form-row cols-2">
            <div class="form-group"><label>SKU</label><input type="text" id="f_sku" value="${e.sku||''}"></div>
          </div>
          <div class="form-group"><label>Descrição Curta</label><input type="text" id="f_short" value="${e.short||''}"></div>
          <div class="form-group"><label>Descrição Completa</label><textarea id="f_desc" rows="5">${e.desc||''}</textarea></div>
        </div>

        <div class="admin-panel kv-form">
          <h3>Preço e Estoque</h3>
          <div class="form-row cols-3">
            <div class="form-group"><label>Preço (R$)</label><input type="number" step="0.01" id="f_price" value="${e.price||''}" required></div>
            <div class="form-group"><label>Preço Promocional (R$)</label><input type="number" step="0.01" id="f_promo" value="${e.promo||''}"></div>
            <div class="form-group"><label>Estoque</label><input type="number" id="f_stock" value="${e.stock??''}" required></div>
          </div>
        </div>

        <div class="admin-panel kv-form">
          <h3>Especificações</h3>
          <div class="form-row cols-3">
            <div class="form-group"><label>Material</label><input type="text" id="f_material" value="${e.material||''}"></div>
          </div>
          <label style="display:block;margin:14px 0 6px">Dimensões da embalagem (cm)</label>
          <p style="font-size:12.5px;color:var(--gray-500);margin:-2px 0 10px">Aparece como especificação na página do produto ("Tamanho"). Deixe em branco se não souber ainda.</p>
          <div class="form-row cols-3">
            <div class="form-group"><label>Comprimento</label><input type="number" step="0.1" min="0" id="f_length" value="${e.length_cm ?? ''}" placeholder="cm"></div>
            <div class="form-group"><label>Largura</label><input type="number" step="0.1" min="0" id="f_width" value="${e.width_cm ?? ''}" placeholder="cm"></div>
            <div class="form-group"><label>Altura</label><input type="number" step="0.1" min="0" id="f_height" value="${e.height_cm ?? ''}" placeholder="cm"></div>
          </div>
        </div>

        <div class="admin-panel kv-form">
          <h3>Cores disponíveis</h3>
          <p style="font-size:12.5px;color:var(--gray-500);margin:-4px 0 12px">Cadastre as opções de cor que o cliente vai poder escolher na página do produto. Se não cadastrar nenhuma, o produto não mostra seletor de cor (fica só com a foto padrão).</p>
          <div style="display:flex;gap:8px;margin-bottom:12px">
            <input type="text" id="f_colorName" placeholder="Nome da cor (ex: Vermelho)" style="flex:1">
            <input type="color" id="f_colorHex" value="#c0392b" style="width:48px;height:40px;padding:2px;border-radius:8px;border:1.5px solid #e2e2e2;cursor:pointer">
            <button type="button" class="btn btn-black" id="f_colorAddBtn" style="white-space:nowrap">+ Adicionar</button>
          </div>
          <div id="f_colorList" style="display:flex;flex-wrap:wrap;gap:8px"></div>
        </div>

        <div class="admin-panel kv-form">
          <h3>Imagens e Vídeos</h3>
          <div class="upload-box">📷 Arraste imagens aqui ou clique para enviar (ilimitado) — integração Cloudinary</div>
          <div class="upload-box" style="margin-top:12px">🎬 Adicionar vídeo do produto (URL ou upload)</div>
        </div>
      </div>

      <div>
        <div class="admin-panel kv-form">
          <h3>Tags</h3>
          <div style="display:flex;gap:8px;margin-bottom:10px">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="tag_novo" ${(e.tags||[]).includes('novo')?'checked':''}> Novo</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="tag_promocao" ${(e.tags||[]).includes('promocao')?'checked':''}> Promoção</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="tag_maisvendido" ${(e.tags||[]).includes('mais-vendido')?'checked':''}> Mais Vendido</label>
          </div>
        </div>

        <div class="admin-panel kv-form">
          <h3>SEO</h3>
          <div class="form-group"><label>Meta Título</label><input type="text" id="f_seotitle" placeholder="${e.name||'Nome do produto'} | Criativo Brasil 3D"></div>
          <div class="form-group"><label>Meta Descrição</label><textarea id="f_seodesc" rows="3" placeholder="${e.short||''}"></textarea></div>
        </div>

        <div class="admin-panel">
          <h3>Publicação</h3>
          <div class="form-group"><label>Status</label>
            <select id="f_status"><option>Publicado</option><option>Rascunho</option><option>Arquivado</option></select>
          </div>
          <button type="submit" class="btn btn-gold btn-block">Salvar Produto</button>
          <a href="produtos.html" class="btn btn-ghost btn-block" style="margin-top:10px">Cancelar</a>
        </div>
      </div>
    </form>`;

  // Subcategoria depende da categoria escolhida (ex.: categoria "Casa" tem a
  // subcategoria "Banheiro"). O select de subcategoria é repopulado sempre
  // que a categoria muda, e tenta manter a subcategoria já salva no produto
  // (e.subcat) se ela ainda pertencer à categoria selecionada.
  function renderSubcatOptions(preserveSelected){
    const catSlug = document.getElementById('f_cat').value;
    const cat = CATEGORIES.find(cc=>cc.slug===catSlug);
    const subs = (cat && cat.subcategories) || [];
    const wanted = preserveSelected ? e.subcat : document.getElementById('f_subcat').value;
    document.getElementById('f_subcat').innerHTML = '<option value="">Sem subcategoria</option>' +
      subs.map(s=>`<option value="${s.slug}" ${wanted===s.slug?'selected':''}>${s.name}</option>`).join('');
  }
  document.getElementById('f_cat').addEventListener('change', () => renderSubcatOptions(false));
  renderSubcatOptions(true);

  // ---------- Cores disponíveis (variantes que o cliente escolhe no produto) ----------
  // Guardado como lista { name, hex } no próprio produto. Mantido em memória
  // aqui (array `colors`) e só vira parte do produto salvo no submit do
  // formulário — igual ao padrão já usado para tags.
  let colors = (e.colors || []).map(cl => ({ name: cl.name, hex: cl.hex }));
  function renderColorList(){
    const el = document.getElementById('f_colorList');
    if (!colors.length) { el.innerHTML = '<p style="font-size:12.5px;color:#999;margin:0">Nenhuma cor cadastrada ainda — o produto vai aparecer sem seletor de cor.</p>'; return; }
    el.innerHTML = colors.map((cl,i) => `
      <span style="display:inline-flex;align-items:center;gap:7px;background:var(--gray-100);border-radius:20px;padding:5px 8px 5px 6px;font-size:13px">
        <span style="width:18px;height:18px;border-radius:50%;background:${cl.hex};border:1px solid rgba(0,0,0,.15);display:inline-block;flex-shrink:0"></span>
        ${cl.name}
        <button type="button" onclick="window.__removeColor(${i})" style="border:none;background:none;cursor:pointer;color:var(--red);font-size:16px;line-height:1;padding:0 2px" aria-label="Remover cor">×</button>
      </span>`).join('');
  }
  window.__removeColor = function(i){ colors.splice(i,1); renderColorList(); };
  document.getElementById('f_colorAddBtn').addEventListener('click', () => {
    const nameInp = document.getElementById('f_colorName');
    const hexInp = document.getElementById('f_colorHex');
    const name = nameInp.value.trim();
    if (!name) { nameInp.focus(); return; }
    colors.push({ name, hex: hexInp.value });
    nameInp.value = '';
    nameInp.focus();
    renderColorList();
  });
  document.getElementById('f_colorName').addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); document.getElementById('f_colorAddBtn').click(); }
  });
  renderColorList();

  document.getElementById('prodForm').addEventListener('submit', function(ev){
    ev.preventDefault();
    const tags = [];
    if (document.getElementById('tag_novo').checked) tags.push('novo');
    if (document.getElementById('tag_promocao').checked) tags.push('promocao');
    if (document.getElementById('tag_maisvendido').checked) tags.push('mais-vendido');
    const length_cm = parseFloat(document.getElementById('f_length').value);
    const width_cm = parseFloat(document.getElementById('f_width').value);
    const height_cm = parseFloat(document.getElementById('f_height').value);
    const product = {
      id: e.id, slug: document.getElementById('f_slug').value, name: document.getElementById('f_name').value,
      cat: document.getElementById('f_cat').value, subcat: document.getElementById('f_subcat').value || null,
      sku: document.getElementById('f_sku').value,
      short: document.getElementById('f_short').value, desc: document.getElementById('f_desc').value,
      price: parseFloat(document.getElementById('f_price').value)||0,
      promo: parseFloat(document.getElementById('f_promo').value)||null,
      stock: parseInt(document.getElementById('f_stock').value)||0,
      material: document.getElementById('f_material').value,
      length_cm: isNaN(length_cm) ? null : length_cm,
      width_cm: isNaN(width_cm) ? null : width_cm,
      height_cm: isNaN(height_cm) ? null : height_cm,
      colors, tags,
      rating: e.rating || 5, reviews: e.reviews || 0,
    };
    AdminStore.upsertProduct(product);
    alert('Produto salvo com sucesso!');
    location.href = 'produtos.html';
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos — Painel Admin | Criativo Brasil 3D</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  adminLayout('pedidos.html', 'Pedidos', 'Acompanhe e gerencie todos os pedidos da loja');
  const c = document.getElementById('adminContent');

  const STATUS = ['Aguardando Pagamento','Processando','Enviado','Entregue','Cancelado'];
  const stPill = { 'Aguardando Pagamento':'pill-gray','Processando':'pill-gold','Enviado':'pill-blue','Entregue':'pill-green','Cancelado':'pill-red' };

  // Pedidos reais, vindos do banco de dados (Postgres/Neon) via /api/orders.
  // Cada pedido feito pelo checkout do site (qualquer cliente, qualquer
  // navegador/dispositivo) aparece aqui automaticamente.
  let allOrders = [];

  function fmtDate(iso){
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return '—';
    return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
  }

  function render(filter){
    let orders = allOrders;
    if (filter) orders = orders.filter(o => o.status === filter);
    document.getElementById('ordTbody').innerHTML = orders.map((o) => {
      const itemCount = (o.itemsDetail||[]).reduce((n,it)=>n+(it.qty||0),0) || 1;
      return `
      <tr>
        <td><strong>${o.id}</strong></td>
        <td>${o.cliente || 'Cliente'}</td>
        <td>${fmtDate(o.created_at)}</td>
        <td>${itemCount} itens</td>
        <td>${formatBRL(o.total)}</td>
        <td>
          <select onchange="changeStatus('${o.id}', this.value)" style="border:none;background:transparent;font-size:12px;font-weight:700" class="pill ${stPill[o.status]}">
            ${STATUS.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </td>
        <td>
          <div class="row-actions">
            <button title="Ver detalhes" onclick="verDetalhes('${o.id}')">${AICO.eye}</button>
            <button title="Dados para postagem" onclick="abrirPostagem('${o.id}')">${AICO.print}</button>
          </div>
        </td>
      </tr>`;
    }).join('') || `<tr><td colspan="7" style="text-align:center;color:#999;padding:30px">Nenhum pedido encontrado.</td></tr>`;
  }
  function verDetalhes(id){
    const o = allOrders.find(x=>x.id===id);
    if (!o) return;
    const itens = (o.itemsDetail||[]).map(it => `${it.qty}x ${it.name}`).join('\n') || '—';
    const rastreio = o.tracking_code ? `\nCódigo de rastreio: ${o.tracking_code}` : '';
    alert(`Pedido ${o.id}\nCliente: ${o.cliente||'—'} (${o.email||'—'})\nTelefone: ${o.telefone||'—'}\nStatus: ${o.status}\nTotal: ${formatBRL(o.total)}${rastreio}\n\nItens:\n${itens}`);
  }

  // -------------------------------------------------------------------
  // "Dados para postagem" — a emissão automática da etiqueta ainda não
  // está integrada (isso exigiria uma permissão extra no token da Melhor
  // Envio, hoje limitado só à cotação — ver claude/site-progresso.md).
  // Enquanto isso não é feito, este painel pelo menos junta tudo que é
  // preciso digitar no site da Melhor Envio num lugar só — endereço
  // completo, CPF, serviço já escolhido/pago e peso/dimensões calculados
  // a partir do catálogo — com um botão de copiar, para não ter que
  // procurar essas informações em vários lugares (e-mail, catálogo, etc.)
  // nem redigitar tudo à mão.
  const CEP_ORIGEM = '11730-576';

  function pesoDimensoesPedido(itemsDetail){
    let pesoKg = 0, maiorComp = 0, maiorLarg = 0, somaAlt = 0, algumEstimado = false;
    (itemsDetail||[]).forEach(it => {
      const p = typeof getProduct === 'function' ? getProduct(it.product_id) : null;
      const qty = it.qty || 1;
      if (p && p.weight_kg){
        pesoKg += p.weight_kg * qty;
        maiorComp = Math.max(maiorComp, p.length_cm||0);
        maiorLarg = Math.max(maiorLarg, p.width_cm||0);
        somaAlt += (p.height_cm||0) * qty;
      } else {
        // Produto não encontrado no catálogo (ex.: removido depois da venda)
        // — usa uma estimativa razoável só para não travar a tela.
        pesoKg += 0.3 * qty;
        maiorComp = Math.max(maiorComp, 16); maiorLarg = Math.max(maiorLarg, 11); somaAlt += 5 * qty;
        algumEstimado = true;
      }
    });
    return {
      pesoKg: Math.max(0.1, round2(pesoKg)),
      compCm: Math.max(16, Math.ceil(maiorComp)),
      largCm: Math.max(11, Math.ceil(maiorLarg)),
      altCm: Math.max(2, Math.ceil(somaAlt)),
      algumEstimado,
    };
  }
  function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }

  function abrirPostagem(id){
    const o = allOrders.find(x=>x.id===id);
    if (!o) return;
    const dim = pesoDimensoesPedido(o.itemsDetail);
    const enderecoLinha = [
      [o.rua, o.numero].filter(Boolean).join(', '),
      o.complemento,
      o.bairro,
      [o.cidade, o.uf].filter(Boolean).join('/'),
      o.cep,
    ].filter(Boolean).join(' — ');
    const temEndereco = !!(o.rua && o.cep);

    const texto = [
      `Pedido: ${o.id}`,
      `Destinatário: ${o.cliente || '—'}${o.cpf ? ' — CPF ' + o.cpf : ''}`,
      `Telefone: ${o.telefone || '—'}`,
      `Endereço: ${temEndereco ? enderecoLinha : 'não informado neste pedido'}`,
      `CEP origem (remetente): ${CEP_ORIGEM}`,
      `Serviço escolhido no site: ${o.shipping_label || '—'} (frete pago: ${formatBRL(o.shipping||0)})`,
      `Peso estimado: ${dim.pesoKg} kg`,
      `Dimensões estimadas: ${dim.compCm} x ${dim.largCm} x ${dim.altCm} cm`,
    ].join('\n');

    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
    modal.innerHTML = `
      <div style="background:#fff;border-radius:14px;max-width:480px;width:100%;padding:26px;max-height:85vh;overflow:auto">
        <h3 style="margin:0 0 4px">Dados para postagem — ${o.id}</h3>
        <p style="font-size:12.5px;color:var(--gray-500);margin:0 0 18px">Cole estes dados no site da Melhor Envio para gerar a etiqueta. A emissão automática ainda não está integrada.</p>
        ${!temEndereco ? '<p style="font-size:12.5px;color:var(--red);margin:0 0 12px">Este pedido não tem endereço completo salvo (foi feito antes desta atualização). Confirme o endereço direto com o cliente.</p>' : ''}
        ${dim.algumEstimado ? '<p style="font-size:12.5px;color:var(--red);margin:0 0 12px">Peso/dimensões de ao menos um item foram estimados (produto não encontrado no catálogo atual) — confira antes de postar.</p>' : ''}
        <pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;background:var(--gray-100,#f4f4f4);border-radius:10px;padding:14px;line-height:1.7">${texto}</pre>
        <div style="display:flex;gap:10px;margin-top:16px">
          <button class="btn btn-gold" style="flex:1" id="copiarPostagemBtn">Copiar dados</button>
          <button class="btn btn-ghost" id="fecharPostagemBtn">Fechar</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', (e)=>{ if (e.target === modal) modal.remove(); });
    modal.querySelector('#fecharPostagemBtn').addEventListener('click', ()=> modal.remove());
    modal.querySelector('#copiarPostagemBtn').addEventListener('click', async ()=>{
      try {
        await navigator.clipboard.writeText(texto);
        showToast('Copiado!', 'Dados prontos para colar na Melhor Envio.');
      } catch (e) {
        showToast('Não foi possível copiar', 'Selecione o texto manualmente.');
      }
    });
  }
  window.abrirPostagem = abrirPostagem;

  // -------------------------------------------------------------------
  // Ao marcar um pedido como "Enviado", abre um pequeno formulário para
  // colar o código de rastreio dos Correios. Se um e-mail for salvo no
  // pedido, isso dispara automaticamente um e-mail para o cliente com o
  // código e o link de rastreamento (ver api/_email.js → sendShippedEmail).
  // O admin pode pular essa etapa e preencher depois, se ainda não tiver
  // o código em mãos (ex.: ainda não comprou a etiqueta na Melhor Envio).
  function abrirRastreio(id){
    const o = allOrders.find(x=>x.id===id);
    if (!o) return;
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
    modal.innerHTML = `
      <div style="background:#fff;border-radius:14px;max-width:420px;width:100%;padding:26px">
        <h3 style="margin:0 0 4px">Pedido marcado como Enviado — ${o.id}</h3>
        <p style="font-size:12.5px;color:var(--gray-500);margin:0 0 16px">Cole o código de rastreio dos Correios (gerado na Melhor Envio) para avisar o cliente automaticamente por e-mail. Pode deixar em branco e preencher depois.</p>
        <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:6px">Código de rastreio</label>
        <input id="rastreioInput" type="text" placeholder="Ex: AA123456789BR" value="${o.tracking_code || ''}" style="width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid #e2e2e2;font-size:13.5px;margin-bottom:16px;box-sizing:border-box">
        ${!o.email ? '<p style="font-size:11.5px;color:var(--red);margin:0 0 16px">Este pedido não tem e-mail salvo — não será possível notificar automaticamente, mesmo salvando o código.</p>' : ''}
        <div style="display:flex;gap:10px">
          <button class="btn btn-gold" style="flex:1" id="salvarRastreioBtn">${o.email ? 'Salvar e notificar cliente' : 'Salvar código'}</button>
          <button class="btn btn-ghost" id="pularRastreioBtn">Pular por agora</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', (e)=>{ if (e.target === modal) modal.remove(); });
    modal.querySelector('#pularRastreioBtn').addEventListener('click', ()=> modal.remove());
    modal.querySelector('#salvarRastreioBtn').addEventListener('click', async ()=>{
      const code = modal.querySelector('#rastreioInput').value.trim();
      modal.remove();
      if (!code) return;
      await updateOrderStatus(id, 'Enviado', code);
      o.tracking_code = code;
      showToast(o.email ? 'Cliente notificado!' : 'Código salvo', o.email ? 'E-mail com o código de rastreio foi enviado.' : 'Este pedido não tem e-mail salvo para notificar.');
    });
  }
  window.abrirRastreio = abrirRastreio;

  async function changeStatus(id, status){
    const o = allOrders.find(x=>x.id===id); if (o) o.status = status;
    render(document.getElementById('statusFilter').value);
    await updateOrderStatus(id, status);
    if (status === 'Enviado') abrirRastreio(id);
  }
  window.changeStatus = changeStatus;
  window.verDetalhes = verDetalhes;

  c.innerHTML = `
    <div class="admin-panel">
      <div class="admin-toolbar">
        <h3 style="margin:0">Todos os Pedidos</h3>
        <select id="statusFilter" onchange="render(this.value)" style="padding:10px 14px;border-radius:10px;border:1.5px solid #e2e2e2;font-size:13px">
          <option value="">Todos os status</option>
          ${STATUS.map(s=>`<option value="${s}">${s}</option>`).join('')}
        </select>
      </div>
      <div style="overflow-x:auto">
        <table class="admin-table">
          <thead><tr><th>Pedido</th><th>Cliente</th><th>Data</th><th>Itens</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead>
          <tbody id="ordTbody"><tr><td colspan="7" style="text-align:center;color:#999;padding:30px">Carregando pedidos...</td></tr></tbody>
        </table>
      </div>
    </div>`;

  (async function init(){
    allOrders = await fetchOrders();
    render('');
    await markOrdersSeen();
    refreshOrderBadge();
  })();
</script>
</body>
</html>

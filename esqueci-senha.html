<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<body>
<div id="site-header"></div>
<section class="section">
  <div class="container auth-wrap">
    <div style="text-align:center;margin-bottom:30px">
      <h1 style="font-size:26px">Esqueci Minha Senha</h1>
      <p style="color:var(--gray-500);margin-top:8px">Enviaremos um link de redefinição para o seu e-mail.</p>
    </div>
    <div class="card">
      <form onsubmit="event.preventDefault(); showToast('E-mail enviado!','Verifique sua caixa de entrada.'); this.reset();">
        <div class="form-group"><label>E-mail cadastrado</label><input type="email" required></div>
        <button class="btn btn-gold btn-block" type="submit">Enviar Link de Recuperação</button>
      </form>
    </div>
    <p style="text-align:center;margin-top:20px;font-size:13.5px"><a href="login.html" style="color:var(--gold-dark);font-weight:700">← Voltar para o login</a></p>
  </div>
</section>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>

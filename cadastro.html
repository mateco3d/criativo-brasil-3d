<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar Conta — Criativo Brasil 3D</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>.auth-wrap { max-width: 460px; margin: 0 auto; }</style>
</head>
<body>
<div id="site-header"></div>
<section class="section">
  <div class="container auth-wrap">
    <div style="text-align:center;margin-bottom:30px">
      <h1 style="font-size:26px">Criar Minha Conta</h1>
      <p style="color:var(--gray-500);margin-top:8px">Leva menos de 1 minuto.</p>
    </div>
    <div class="card">
      <form onsubmit="event.preventDefault(); showToast('Conta criada!','Agora você já pode fazer login.'); setTimeout(()=>location.href='login.html',900);">
        <div class="form-group"><label>Nome Completo</label><input type="text" required></div>
        <div class="form-row cols-2">
          <div class="form-group"><label>E-mail</label><input type="email" required></div>
          <div class="form-group"><label>Telefone</label><input type="tel" required></div>
        </div>
        <div class="form-row cols-2">
          <div class="form-group"><label>Senha</label><input type="password" required></div>
          <div class="form-group"><label>Confirmar Senha</label><input type="password" required></div>
        </div>
        <label style="display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--gray-600);margin-bottom:18px">
          <input type="checkbox" required style="margin-top:2px;accent-color:var(--gold)">
          Concordo com os <a href="termos.html" style="color:var(--gold-dark)">Termos de Uso</a> e a <a href="privacidade.html" style="color:var(--gold-dark)">Política de Privacidade</a>.
        </label>
        <button class="btn btn-gold btn-block" type="submit">Criar Conta</button>
      </form>
    </div>
    <p style="text-align:center;margin-top:20px;font-size:13.5px">Já tem conta? <a href="login.html" style="color:var(--gold-dark);font-weight:700">Entrar</a></p>
  </div>
</section>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>mountLayout(null);</script>
</body>
</html>

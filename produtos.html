<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos — Criativo Brasil 3D</title>
<meta name="description" content="Catálogo completo de produtos em impressão 3D: geek, funko, organização, casa, escritório, narguile, automotivo e personalizados.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23121212%22/><text x=%2250%22 y=%2266%22 font-size=%2244%22 fill=%22%23FFC107%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-weight=%22bold%22>CB</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .shop-wrap { display: grid; grid-template-columns: 260px 1fr; gap: 32px; align-items: flex-start; }
  .filter-box { border: 1px solid #eee; border-radius: var(--radius); padding: 20px; position: sticky; top: 100px; }
  .filter-box h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 14px; }
  .filter-opt { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 13.5px; cursor: pointer; }
  .filter-opt input { accent-color: var(--gold); width: 16px; height: 16px; }
  .filter-divider { height: 1px; background: #eee; margin: 18px 0; }
  .shop-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
  .shop-count { font-size: 13.5px; color: var(--gray-500); }
  select#sortSelect { padding: 10px 14px; border-radius: 10px; border: 1.5px solid #e2e2e2; font-size: 13px; }
  .price-range { display: flex; gap: 8px; }
  .price-range input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1.5px solid #e2e2e2; font-size: 12.5px; }
  @media (max-width: 860px){ .shop-wrap { grid-template-columns: 1fr; } .filter-box { position: static; } }
</style>
</head>
<body>
<div id="site-header"></div>

<div class="page-hero">
  <div class="container">
    <h1 id="pageTitle">Todos os Produtos</h1>
    <p id="pageSub">Explore nosso catálogo completo de impressão 3D</p>
  </div>
</div>

<div class="container">
  <div class="breadcrumb"><a href="index.html">Início</a><span class="sep">/</span><span id="bcCurrent">Produtos</span></div>
</div>

<section class="section" style="padding-top:12px">
  <div class="container">
    <div class="shop-wrap">
      <aside class="filter-box">
        <h4>Categorias</h4>
        <div id="catFilters"></div>
        <div class="filter-divider"></div>
        <h4>Faixa de Preço</h4>
        <div class="price-range">
          <input type="number" id="minPrice" placeholder="Mín">
          <input type="number" id="maxPrice" placeholder="Máx">
        </div>
        <div class="filter-divider"></div>
        <h4>Destaques</h4>
        <label class="filter-opt"><input type="checkbox" class="tagFilter" value="novo"> Novidades</label>
        <label class="filter-opt"><input type="checkbox" class="tagFilter" value="promocao"> Em Promoção</label>
        <label class="filter-opt"><input type="checkbox" class="tagFilter" value="mais-vendido"> Mais Vendidos</label>
        <div class="filter-divider"></div>
        <button class="btn btn-black btn-block" onclick="applyFilters()">Filtrar</button>
        <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="clearFilters()">Limpar Filtros</button>
      </aside>

      <div>
        <div class="shop-toolbar">
          <span class="shop-count" id="resultCount">0 produtos encontrados</span>
          <select id="sortSelect" onchange="applyFilters()">
            <option value="relevance">Ordenar por: Relevância</option>
            <option value="price-asc">Menor Preço</option>
            <option value="price-desc">Maior Preço</option>
            <option value="rating">Melhor Avaliados</option>
            <option value="name">Nome A-Z</option>
          </select>
        </div>
        <div class="prod-grid" id="shopGrid"></div>
        <p id="emptyState" style="display:none;text-align:center;color:#999;padding:60px 0">Nenhum produto encontrado com esses filtros.</p>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
  mountLayout('produtos.html');

  document.getElementById('catFilters').innerHTML = CATEGORIES.map(c => `
    <label class="filter-opt"><input type="checkbox" class="catFilter" value="${c.slug}"> ${c.name}</label>`).join('');

  const params = new URLSearchParams(location.search);
  if (params.get('cat')) {
    const cb = document.querySelector(`.catFilter[value="${params.get('cat')}"]`);
    if (cb) cb.checked = true;
    const cat = CATEGORIES.find(c=>c.slug===params.get('cat'));
    if (cat) { document.getElementById('pageTitle').textContent = cat.name; document.getElementById('pageSub').textContent = cat.desc; document.getElementById('bcCurrent').textContent = cat.name; }
  }
  if (params.get('filter')) {
    const cb = document.querySelector(`.tagFilter[value="${params.get('filter')}"]`);
    if (cb) cb.checked = true;
  }
  const initialQ = params.get('q') || '';

  function applyFilters(){
    const cats = [...document.querySelectorAll('.catFilter:checked')].map(c=>c.value);
    const tags = [...document.querySelectorAll('.tagFilter:checked')].map(c=>c.value);
    const min = parseFloat(document.getElementById('minPrice').value) || 0;
    const max = parseFloat(document.getElementById('maxPrice').value) || Infinity;
    const sort = document.getElementById('sortSelect').value;
    const q = initialQ.toLowerCase();

    let list = PRODUCTS.filter(p => {
      const price = p.promo || p.price;
      if (cats.length && !cats.includes(p.cat)) return false;
      if (tags.length && !tags.some(t=>p.tags.includes(t))) return false;
      if (price < min || price > max) return false;
      if (q && !(p.name.toLowerCase().includes(q) || p.cat.includes(q) || p.short.toLowerCase().includes(q))) return false;
      return true;
    });

    if (sort === 'price-asc') list.sort((a,b)=>(a.promo||a.price)-(b.promo||b.price));
    else if (sort === 'price-desc') list.sort((a,b)=>(b.promo||b.price)-(a.promo||a.price));
    else if (sort === 'rating') list.sort((a,b)=>b.rating-a.rating);
    else if (sort === 'name') list.sort((a,b)=>a.name.localeCompare(b.name));

    document.getElementById('resultCount').textContent = `${list.length} produto${list.length!==1?'s':''} encontrado${list.length!==1?'s':''}`;
    document.getElementById('shopGrid').innerHTML = list.map(productCardHTML).join('');
    document.getElementById('emptyState').style.display = list.length ? 'none' : 'block';
  }
  function clearFilters(){
    document.querySelectorAll('.catFilter,.tagFilter').forEach(c=>c.checked=false);
    document.getElementById('minPrice').value=''; document.getElementById('maxPrice').value='';
    document.getElementById('sortSelect').value='relevance';
    history.replaceState(null,'','produtos.html');
    applyFilters();
  }
  document.querySelectorAll('.catFilter,.tagFilter').forEach(c=>c.addEventListener('change', applyFilters));
  applyFilters();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido Confirmado — Criativo Brasil 3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23121212%22/><text x=%2250%22 y=%2266%22 font-size=%2244%22 fill=%22%23FFC107%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-weight=%22bold%22>CB</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<section class="section" style="min-height:60vh;display:flex;align-items:center">
  <div class="container" style="text-align:center;max-width:560px">
    <div id="statusIcon" style="width:88px;height:88px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 24px">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFC107" stroke-width="2" style="width:44px;height:44px"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1 id="statusTitle" style="font-size:30px">Pedido Confirmado!</h1>
    <p id="statusMsg" style="color:var(--gray-500);margin-top:12px">Obrigado pela sua compra. Enviamos os detalhes para o seu e-mail e você pode acompanhar tudo pela sua conta.</p>
    <div class="card" style="margin:28px 0;text-align:left">
      <div class="summary-row"><span>Número do Pedido</span><strong id="orderId">—</strong></div>
      <div class="summary-row"><span>Total</span><strong id="orderTotal">—</strong></div>
      <div class="summary-row"><span>Status</span><span class="badge-soft" id="statusBadge">Pagamento em Confirmação</span></div>
    </div>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a href="minha-conta.html?tab=pedidos" class="btn btn-outline">Ver Meus Pedidos</a>
      <a href="produtos.html" class="btn btn-gold">Continuar Comprando</a>
    </div>
  </div>
</section>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
  mountLayout(null);
  const params = new URLSearchParams(location.search);
  // O Mercado Pago acrescenta seus próprios parâmetros (status, collection_status,
  // external_reference, payment_id) à URL de retorno que configuramos.
  const orderCode = params.get('order') || params.get('external_reference');
  const mpStatus = params.get('collection_status') || params.get('status');
  let order = null;
  try { order = JSON.parse(localStorage.getItem('cb3d_last_order')); } catch(e){}

  document.getElementById('orderId').textContent = orderCode || (order && order.id) || 'CB3D-000000';
  document.getElementById('orderTotal').textContent = order ? formatBRL(order.total) : '—';

  const STATUS_MAP = {
    approved: { title: 'Pagamento Aprovado!', msg: 'Seu pedido foi confirmado e já entrou na fila de produção. Enviamos os detalhes para o seu e-mail.', badge: 'Pago', color: 'var(--green)' },
    pending: { title: 'Pagamento Pendente', msg: 'Recebemos seu pedido e estamos aguardando a confirmação do pagamento (comum em boleto e alguns métodos Pix).', badge: 'Pendente', color: 'var(--gold-dark)' },
    in_process: { title: 'Pagamento em Análise', msg: 'Seu pagamento está sendo analisado pelo Mercado Pago. Você receberá a confirmação por e-mail em breve.', badge: 'Em Análise', color: 'var(--gold-dark)' },
    rejected: { title: 'Pagamento Não Aprovado', msg: 'Seu pagamento não foi aprovado. Você pode tentar novamente com outro método na finalização da compra.', badge: 'Recusado', color: 'var(--red)' },
    failure: { title: 'Pagamento Não Concluído', msg: 'Algo deu errado ao processar o pagamento. Você pode tentar novamente.', badge: 'Não Concluído', color: 'var(--red)' },
  };
  const s = STATUS_MAP[mpStatus] || (mpStatus ? STATUS_MAP.pending : null);
  if (s){
    document.getElementById('statusTitle').textContent = s.title;
    document.getElementById('statusMsg').textContent = s.msg;
    document.getElementById('statusBadge').textContent = s.badge;
    document.getElementById('statusBadge').style.background = s.color;
    document.getElementById('statusBadge').style.color = '#fff';
    if (mpStatus === 'rejected' || mpStatus === 'failure'){
      document.getElementById('statusIcon').style.background = '#fdeaea';
      document.getElementById('statusIcon').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" style="width:44px;height:44px"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    }
  }

  /* ---------------- Envia o pedido para o Painel Admin ----------------
     Protótipo sem banco de dados: o pedido fica salvo no localStorage
     deste navegador/dispositivo, então só aparece no painel admin se for
     acessado no MESMO navegador que fez a compra. Para pedidos reais de
     clientes aparecerem no admin em qualquer dispositivo, é necessário um
     banco de dados de verdade (ver docs/ARQUITETURA.md). */
  (function syncOrderToAdmin(){
    if (!orderCode && !order) return;
    const STATUS_BY_MP = {
      approved: 'Processando',
      pending: 'Aguardando Pagamento',
      in_process: 'Aguardando Pagamento',
      rejected: 'Cancelado',
      failure: 'Cancelado',
    };
    const status = STATUS_BY_MP[mpStatus] || 'Aguardando Pagamento';
    const id = orderCode || (order && order.id);
    if (!id) return;
    let orders = [];
    try { orders = JSON.parse(localStorage.getItem('cb3d_admin_orders')) || []; } catch (e) { orders = []; }
    const dateObj = new Date((order && order.date) || Date.now());
    const dateStr = isNaN(dateObj) ? '' : String(dateObj.getDate()).padStart(2,'0') + '/' + String(dateObj.getMonth()+1).padStart(2,'0') + '/' + dateObj.getFullYear();
    const record = {
      id,
      cliente: (order && order.cliente) || 'Cliente',
      date: dateStr,
      total: (order && order.total) || 0,
      status,
      items: (order && order.items) || 1,
    };
    const existing = orders.find(o => o.id === id);
    if (existing) { Object.assign(existing, record); } else { orders.unshift(record); }
    localStorage.setItem('cb3d_admin_orders', JSON.stringify(orders));
  })();
</script>
</body>
</html>

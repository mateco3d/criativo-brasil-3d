<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cupons e Promoções — Painel Admin | Criativo Brasil 3D</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  adminLayout('cupons.html', 'Cupons e Promoções', 'Crie cupons de desconto para o pedido inteiro ou para um produto específico');
  const c = document.getElementById('adminContent');

  // Cupons agora são reais — gravados no banco de dados (/api/coupons) e
  // aplicados de verdade no checkout (ver api/_coupons.js). Um cupom pode
  // valer para a loja inteira ou só para um produto escolhido aqui: nesse
  // caso, o cliente só consegue usá-lo comprando aquele produto (o campo
  // de cupom aparece na própria página do produto).
  const TYPE_LABEL = { percent: '% de desconto', fixed: 'Valor fixo (R$)', shipping: 'Frete grátis' };

  function discountLabel(cp){
    if (cp.type === 'percent') return `${Number(cp.value)}% de desconto`;
    if (cp.type === 'fixed') return `${formatBRL(Number(cp.value))} de desconto`;
    return 'Frete grátis';
  }
  function productLabel(cp){
    if (!cp.product_id) return 'Todos os produtos';
    const p = getProduct(cp.product_id);
    return p ? p.name : cp.product_id;
  }

  c.innerHTML = `
    <div class="admin-grid-2">
      <div class="admin-panel">
        <h3>Cupons Cadastrados</h3>
        <table class="admin-table">
          <thead><tr><th>Código</th><th>Desconto</th><th>Vale para</th><th>Usos</th><th>Expira</th><th>Status</th><th>Ações</th></tr></thead>
          <tbody id="couponTbody"><tr><td colspan="7" style="text-align:center;color:#999;padding:24px">Carregando cupons...</td></tr></tbody>
        </table>
      </div>
      <div class="admin-panel kv-form">
        <h3>Criar Novo Cupom</h3>
        <form id="cpForm">
          <div class="form-group"><label>Código do Cupom</label><input type="text" id="cp_code" placeholder="EX: PROMO20" required></div>
          <div class="form-row cols-2">
            <div class="form-group"><label>Tipo</label>
              <select id="cp_type"><option value="percent">% Desconto</option><option value="fixed">Valor Fixo (R$)</option><option value="shipping">Frete Grátis</option></select>
            </div>
            <div class="form-group" id="cp_value_group"><label>Valor</label><input type="number" id="cp_value" value="10" min="0" step="0.01"></div>
          </div>
          <div class="form-group">
            <label>Vale para</label>
            <select id="cp_product">
              <option value="">Todos os produtos (cupom geral)</option>
              ${PRODUCTS.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
            </select>
          </div>
          <div class="form-row cols-2">
            <div class="form-group"><label>Limite de Usos (opcional)</label><input type="number" id="cp_limit" placeholder="Sem limite" min="1"></div>
            <div class="form-group"><label>Validade (opcional)</label><input type="date" id="cp_expires"></div>
          </div>
          <button class="btn btn-gold btn-block" type="submit">Criar Cupom</button>
        </form>
      </div>
    </div>`;

  document.getElementById('cp_type').addEventListener('change', function(){
    document.getElementById('cp_value_group').style.display = this.value === 'shipping' ? 'none' : '';
  });

  async function fetchCoupons(){
    try {
      const res = await fetch('/api/coupons');
      if (!res.ok) return [];
      const data = await res.json();
      return data.coupons || [];
    } catch (e) { return []; }
  }

  function render(coupons){
    document.getElementById('couponTbody').innerHTML = coupons.length ? coupons.map(cp => `
      <tr>
        <td><strong>${cp.code}</strong></td>
        <td>${discountLabel(cp)}</td>
        <td>${productLabel(cp)}</td>
        <td>${cp.uses}${cp.usage_limit ? ' / ' + cp.usage_limit : ''}</td>
        <td>${cp.expires_at ? new Date(cp.expires_at).toLocaleDateString('pt-BR') : '—'}</td>
        <td><span class="pill ${cp.active ? 'pill-green' : 'pill-gray'}">${cp.active ? 'Ativo' : 'Inativo'}</span></td>
        <td><div class="row-actions"><button title="Ativar/Desativar" onclick="toggleCoupon('${cp.code}', ${!cp.active})">${AICO.edit}</button><button title="Excluir" onclick="delCoupon('${cp.code}')">${AICO.trash}</button></div></td>
      </tr>`).join('') : `<tr><td colspan="7" style="text-align:center;color:#999;padding:24px">Nenhum cupom criado ainda.</td></tr>`;
  }

  async function reload(){
    render(await fetchCoupons());
  }

  window.toggleCoupon = async function(code, active){
    await fetch('/api/coupons', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code, active }) });
    reload();
  };
  window.delCoupon = async function(code){
    if (!confirm('Excluir cupom?')) return;
    await fetch('/api/coupons', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
    reload();
  };

  document.getElementById('cpForm').addEventListener('submit', async function(ev){
    ev.preventDefault();
    const btn = this.querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
      const res = await fetch('/api/coupons', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          code: document.getElementById('cp_code').value,
          type: document.getElementById('cp_type').value,
          value: +document.getElementById('cp_value').value || 0,
          productId: document.getElementById('cp_product').value || null,
          usageLimit: document.getElementById('cp_limit').value || null,
          expiresAt: document.getElementById('cp_expires').value || null,
        }),
      });
      const data = await res.json();
      if (!res.ok) { showToast('Não foi possível criar o cupom', data.error || 'Tente novamente.'); return; }
      showToast('Cupom criado!', 'Já está valendo no site.');
      this.reset();
      document.getElementById('cp_value_group').style.display = '';
      reload();
    } finally {
      btn.disabled = false;
    }
  });

  reload();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos — Painel Admin | Criativo Brasil 3D</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  adminLayout('pedidos.html', 'Pedidos', 'Acompanhe e gerencie todos os pedidos da loja');
  const c = document.getElementById('adminContent');

  const STATUS = ['Aguardando Pagamento','Processando','Enviado','Entregue','Cancelado'];
  const stPill = { 'Aguardando Pagamento':'pill-gray','Processando':'pill-gold','Enviado':'pill-blue','Entregue':'pill-green','Cancelado':'pill-red' };

  // Pedidos reais são registrados aqui automaticamente quando um cliente
  // finaliza uma compra pelo checkout (ver pedido-confirmado.html). Sem
  // banco de dados ainda, só aparecem os pedidos feitos NESTE navegador.
  if (!localStorage.getItem('cb3d_admin_orders')) {
    localStorage.setItem('cb3d_admin_orders', JSON.stringify([]));
  }

  function render(filter){
    let orders = JSON.parse(localStorage.getItem('cb3d_admin_orders')||'[]');
    if (filter) orders = orders.filter(o => o.status === filter);
    document.getElementById('ordTbody').innerHTML = orders.map((o,i) => `
      <tr>
        <td><strong>${o.id}</strong></td>
        <td>${o.cliente}</td>
        <td>${o.date}</td>
        <td>${o.items} itens</td>
        <td>${formatBRL(o.total)}</td>
        <td>
          <select onchange="changeStatus('${o.id}', this.value)" style="border:none;background:transparent;font-size:12px;font-weight:700" class="pill ${stPill[o.status]}">
            ${STATUS.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </td>
        <td>
          <div class="row-actions">
            <button title="Ver detalhes" onclick="alert('Pedido ${o.id}\\nCliente: ${o.cliente}\\nTotal: ${formatBRL(o.total)}')">${AICO.eye}</button>
            <button title="Emitir etiqueta" onclick="alert('Etiqueta de envio gerada para o pedido ${o.id} (integração Correios).')">${AICO.print}</button>
          </div>
        </td>
      </tr>`).join('') || `<tr><td colspan="7" style="text-align:center;color:#999;padding:30px">Nenhum pedido encontrado.</td></tr>`;
  }
  function changeStatus(id, status){
    const orders = JSON.parse(localStorage.getItem('cb3d_admin_orders')||'[]');
    const o = orders.find(x=>x.id===id); if (o) o.status = status;
    localStorage.setItem('cb3d_admin_orders', JSON.stringify(orders));
    render(document.getElementById('statusFilter').value);
  }

  c.innerHTML = `
    <div class="admin-panel">
      <div class="admin-toolbar">
        <h3 style="margin:0">Todos os Pedidos</h3>
        <select id="statusFilter" onchange="render(this.value)" style="padding:10px 14px;border-radius:10px;border:1.5px solid #e2e2e2;font-size:13px">
          <option value="">Todos os status</option>
          ${STATUS.map(s=>`<option value="${s}">${s}</option>`).join('')}
        </select>
      </div>
      <div style="overflow-x:auto">
        <table class="admin-table">
          <thead><tr><th>Pedido</th><th>Cliente</th><th>Data</th><th>Itens</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead>
          <tbody id="ordTbody"></tbody>
        </table>
      </div>
    </div>`;
  render('');
</script>
</body>
</html>
